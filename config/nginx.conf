server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # SPA fallback: webpack-dev-server used history-api-fallback, so unknown
    # routes must serve index.html rather than 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively; they are content-addressed.
    location ~* \.(?:js|css|svg|png|jpg|wav|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the HTML entrypoint so new builds are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip            on;
    gzip_types      text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}
