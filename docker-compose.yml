services:
  # Production: static build served by nginx.
  # Run with: docker compose up web
  web:
    build:
      context: .
      target: serve
    image: lumines-react:latest
    ports:
      - "8080:80"
    restart: unless-stopped

  # Development: webpack-dev-server with hot reload.
  # Run with: docker compose --profile dev up dev
  dev:
    profiles: ["dev"]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "yarn install && yarn watch --host 0.0.0.0"
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
